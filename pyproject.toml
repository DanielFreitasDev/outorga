[project]
name = "outorga"
version = "0.1.0"
description = "Verificação de poderes de quem assina a ATPV-e (empresa ou pessoa física com procuração; vendendo ou comprando): leitura por IA local + motor de regras jurídicas + faixa intermediária de aceitação"
readme = "README.md"
authors = [
    { name = "Daniel Freitas", email = "danielsfreitas97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.11.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sse-starlette>=3.5.0",
    "unidecode>=1.4.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
outorga = "outorga:main"

[project.optional-dependencies]
claude = [
    "anthropic>=1.15.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
